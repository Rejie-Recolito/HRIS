# Render service manifest - web service using Dockerfile.render
services:
  - type: web
    name: hris-web
    env: docker
    plan: free
    region: iad
    dockerfilePath: Dockerfile.render
    autoDeploy: true
# A managed Postgres could be added via the dashboard or using the add-ons section on Render
# Addons example (optional):
# addons:
#   - type: postgres
#     name: hris-postgres
#     plan: free
