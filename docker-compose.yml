version: "3.8"
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: hris_app:latest
        restart: unless-stopped
        env_file: .env
        volumes:
            - ./:/var/www/html:cached
            - ./storage:/var/www/html/storage
        depends_on:
            - db
        networks:
            - hris-net

    web:
        image: nginx:stable-alpine
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - hris-net

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: hris
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: hris
            MYSQL_PASSWORD: secret
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - hris-net

volumes:
    dbdata:

networks:
    hris-net:
        driver: bridge
